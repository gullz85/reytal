<style>
  :root{
    --black:#0B0C0D;
    --navy:#0D4659;
    --slate:#4C7C93;
    --grey:#9AA1A6;
    --sage:#BEBFA6;
    --cream:#F3F0EA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overscroll-behavior-y:none;}
  body{
    font-family:'DM Sans',sans-serif;
    background:var(--cream);
    color:var(--black);
    overflow-x:hidden;
    min-height:100vh;min-height:100dvh;
  }
  a{color:inherit;}

  /* ── reikandi ljós í bakgrunni, sama uppskrift og annars staðar á vefnum ── */
  .orb{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;will-change:transform;}
  .blob{
    position:absolute;left:50%;top:50%;
    width:min(60vw,760px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 36% 34%,
                 rgba(13,70,89,0.20),
                 rgba(76,124,147,0.12) 45%,
                 rgba(190,191,166,0.06) 66%,
                 transparent 74%);
    filter:blur(48px);
    animation:roam 52s ease-in-out infinite;
    will-change:transform;
  }
  @keyframes roam{
    0%,100%{transform:translate(-50%,-50%) translate(-24vw,-12vh) scale(1);}
    22%    {transform:translate(-50%,-50%) translate( 20vw,-10vh) scale(1.14);}
    44%    {transform:translate(-50%,-50%) translate( 26vw, 4vh) scale(0.94);}
    68%    {transform:translate(-50%,-50%) translate( -6vw, 10vh) scale(1.10);}
    86%    {transform:translate(-50%,-50%) translate(-26vw, -2vh) scale(1.02);}
  }
  @media (prefers-reduced-motion:reduce){ .blob{animation:none;} }

  /* ── SVIÐIÐ ─────────────────────────────────────────────────── */
  .stage{
    position:relative;z-index:1;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .stack{
    position:relative;
    width:min(46vw,340px);aspect-ratio:23.19/18.89;
  }
  /* merkið og 404 eru bæði miðjusett með sama, ótvíræða trixi (top/left 50%
     + translate -50%,-50%) svo þau deili nákvæmlega sama miðjupunkti óháð
     eigin stærð - engin grid/stretch-óvissa sem gæti skekkt miðjusetninguna */
  .mark,.fof{position:absolute;top:50%;left:50%;}

  /* merkið: sama REYTAL-táknið og annars staðar á vefnum - er alltaf til
     staðar frá byrjun, engin innkoma, bara kyrrt þangað til það dettur saman.
     Sama flip-tækni og "Lausnir" í hero-fyrirsögninni (scaleX/scaleY, engin
     þrívídd) en ÖFUGT: byrjar rétt/eðlilegt og fellur svo saman í línu í
     miðjunni (scaleY->0, "dettur inn í sig") og flettist við um leið -
     nákvæmlega á hvolf miðað við hvernig Lausnir réttir sig af */
  .mark{
    width:100%;height:100%;fill:var(--black);
    transform-origin:center;
    transform:translate(-50%,-50%) scaleX(1) scaleY(1);opacity:1;
  }
  @keyframes markFlipOut{
    0%   { transform:translate(-50%,-50%) scaleX(1)  scaleY(1);    opacity:1; }
    46%  { transform:translate(-50%,-50%) scaleX(1)  scaleY(0.02); opacity:1; }
    50%  { transform:translate(-50%,-50%) scaleX(-1) scaleY(0.02); opacity:1; }
    64%  { transform:translate(-50%,-50%) scaleX(-1) scaleY(0.02); opacity:0; }
    100% { transform:translate(-50%,-50%) scaleX(-1) scaleY(0.02); opacity:0; }
  }
  .mark.collapse{animation:markFlipOut .72s cubic-bezier(.4,0,.6,1) forwards;}

  /* 404: byrjar sem sama mjóa línan og REYTAL-merkið lokaðist í, opnast svo
     upp og niður út frá miðjunni - öfug átt miðað við hvernig merkið
     lokaðist saman (nákvæmlega sama sviðsetning og flip-word tæknin,
     bara á hinn veginn) */
  .fof{
    font-family:'Archivo',sans-serif;font-weight:900;
    font-size:clamp(72px,17vw,236px);line-height:1;letter-spacing:-0.02em;
    color:var(--black);white-space:nowrap;
    transform-origin:center;
    opacity:0;transform:translate(-50%,-50%) scaleY(0.02);
  }
  /* augnabliki þar sem 404 er nákvæmlega sama lína og merkið hvarf í -
     engin transition, birtist samstundis */
  .fof.line{opacity:1;transition:none;}
  /* opnast svo upp og niður, hvort í sína áttina, út frá línunni */
  .fof.show{
    transform:translate(-50%,-50%) scaleY(1);
    transition:transform .68s cubic-bezier(.4,0,.6,1);
  }

  .msg{
    margin-top:clamp(22px,4vh,40px);
    font-size:clamp(16px,1.8vw,19px);line-height:1.6;color:#2a2a2a;
    max-width:44ch;position:relative;z-index:1;
    opacity:0;transform:translateY(14px);
    transition:opacity .7s ease, transform .7s cubic-bezier(.25,.6,.25,1);
  }
  .msg.show{opacity:1;transform:translateY(0);}

  .btn-primary{
    margin-top:clamp(22px,4vh,36px);
    background:var(--black);color:var(--cream);
    padding:15px 30px;border-radius:999px;font-weight:600;font-size:14px;
    text-decoration:none;display:inline-block;text-align:center;
    font-family:'DM Mono',monospace;letter-spacing:0.03em;text-transform:uppercase;
    white-space:nowrap;position:relative;overflow:hidden;
    opacity:0;transform:translateY(14px);
    transition:opacity .7s ease, transform .35s cubic-bezier(.25,.6,.25,1), box-shadow .35s ease;
  }
  .btn-primary.show{opacity:1;transform:translateY(0);}
  .btn-primary .btn-label{position:relative;z-index:1;display:block;}
  .btn-primary::before{
    content:'';position:absolute;inset:0;background:var(--navy);border-radius:inherit;
    transform:translateY(101%);
    transition:transform .4s cubic-bezier(.25,.7,.25,1);
  }
  .btn-primary:hover::before{transform:translateY(0);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,12,13,0.18);}

  @media (prefers-reduced-motion:reduce){
    .mark,.fof,.msg,.btn-primary{transition:none !important;animation:none !important;}
  }

  @media (max-width:620px){
    .stack{width:min(58vw,220px);}
  }
</style>
</head>
<body>

  <div class="orb"><div class="blob"></div></div>

  <div class="stage" id="stage">
    <div class="stack">
      <svg class="mark" id="mark" viewBox="0 0 23.19 18.89" aria-hidden="true">
        <g id="mT">
          <path d="M14.83,18.89v-1.81h3.17s0-6.73,0-6.73h2.03v6.73s3.17,0,3.17,0v1.81h-8.36Z"/>
          <path d="M9.37,10.35l.5,1.49h3.55l.49-1.49h2.07l-3.14,8.54h-2.41l-3.21-8.54h2.15ZM12.86,13.53h-2.41l.49,1.46c.15.43.39,1.15.72,2.16.42-1.3.66-2.02.71-2.16l.49-1.46Z"/>
          <path d="M3.91,12.16H0v-1.81h5.94v8.54h-2.03v-6.73Z"/>
        </g>
        <g id="mR">
          <path d="M7.03,7.62c0,.38.09.69.24.92h-2.09c-.13-.24-.2-.55-.2-.94l-.04-.96c-.02-.47-.12-.8-.32-.98-.2-.18-.51-.27-.94-.27h-1.66v3.14H0V0h4.04c1,0,1.77.22,2.3.67s.8,1.05.8,1.8c0,.98-.46,1.66-1.38,2.03.44.14.75.36.92.66.17.3.27.72.29,1.26l.06,1.2ZM2.03,3.87h1.79c.39,0,.7-.1.91-.29.22-.2.32-.48.32-.85,0-.74-.42-1.12-1.27-1.12h-1.75v2.25Z"/>
          <path d="M14.25,1.81h-4.1v1.55h3.38v1.7h-3.38v1.67h4.09v1.81h-6.11V0h6.13v1.81Z"/>
          <path d="M20.96,0h2.23l-3.17,5.22v3.32h-2.03v-3.32L14.8,0h2.29l1.97,3.36,1.91-3.36Z"/>
          <path d="M16.65,7.31c.15.14.22.31.22.52s-.07.37-.22.51c-.15.14-.33.21-.53.21s-.39-.07-.54-.21c-.15-.14-.22-.31-.22-.51s.07-.38.22-.52c.15-.14.33-.21.54-.21s.39.07.53.21ZM16.53,8.23c.11-.11.16-.24.16-.4s-.05-.3-.16-.41c-.11-.11-.25-.16-.41-.16s-.3.05-.41.16c-.11.11-.17.24-.17.41s.06.3.17.4c.11.11.25.16.41.16s.3-.05.41-.16ZM16.44,8.1s.01.07.03.09h-.21s-.02-.06-.02-.09v-.08s-.01-.06-.03-.07c-.01-.01-.04-.02-.07-.02h-.12v.26h-.2v-.74h.35c.09,0,.15.02.2.06s.07.09.07.16c0,.08-.03.13-.1.17.06.03.09.08.09.16v.1ZM16.02,7.78h.13c.06,0,.09-.03.09-.08s-.03-.08-.09-.08h-.13v.16Z"/>
        </g>
      </svg>
      <div class="fof" id="fof">404</div>
    </div>

    <p class="msg" id="msg">Síðan sem þú ert að leita að fannst ekki, eða hefur verið flutt annað.</p>
    <a href="/" class="btn-primary" id="cta"><span class="btn-label">Til baka á forsíðu</span></a>
  </div>

<script>
(function(){
  var mark = document.getElementById('mark');
  var fof  = document.getElementById('fof');
  var msg  = document.getElementById('msg');
  var cta  = document.getElementById('cta');
  var stage = document.getElementById('stage');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var done = false;

  function finalState(){
    mark.classList.add('collapse');
    mark.style.opacity = 0;
    fof.classList.add('line');
    fof.classList.add('show');
    msg.classList.add('show');
    cta.classList.add('show');
    done = true;
  }

  if (reduceMotion){
    finalState();
    return;
  }

  // 1: merkið er kyrrt og fullbúið á skjánum, ekkert gerist strax
  // 2: eftir stutta stund fellur það saman í línu og flettist við - öfugt
  //    við hvernig "Lausnir" í hero-fyrirsögninni réttir sig af
  setTimeout(function(){ mark.classList.add('collapse'); }, 900);

  // 3: nákvæmlega þegar merkið er komið saman í línu (~46-50% af .72s
  //    flippinu) birtist 404 sem sama línan - opnast svo upp og niður,
  //    öfug átt miðað við hvernig merkið lokaðist
  setTimeout(function(){
    fof.classList.add('line');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ fof.classList.add('show'); });
    });
  }, 1230);

  // 4: texti og hnappur birtast eftir að 404 er búið að opnast
  setTimeout(function(){ msg.classList.add('show'); }, 1950);
  setTimeout(function(){ cta.classList.add('show'); }, 2150);

  // smellt hvar sem er -> hoppar beint í lokastöðu
  stage.addEventListener('click', function(e){
    if (e.target.closest('a')) return;
    if (done) return;
    finalState();
  });
})();
</script>
</body>
</html>
